# Optional LOCAL / self-host fallback for Evolution API v2.
# For the managed no-VPS deploy use render.yaml or the Railway template (see README.md).
#
#   cp .env.evolution.example .env && docker compose up -d
#   # then create the "harshul" instance and scan the QR (see README.md)

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    env_file:
      - .env
    environment:
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution@postgres:5432/evolution?schema=public
      - CACHE_REDIS_URI=redis://redis:6379

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis:/data

volumes:
  evolution_instances:
  evolution_pg:
  evolution_redis:
