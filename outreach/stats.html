<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stats — Outreach Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="https://powerhousetech.in/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/outreach/styles.css">
</head>
<body>
  <div id="admin-gate" class="gate">
    <div class="gate-card">
      <h1>Admin access</h1>
      <p class="muted" id="gate-msg">Checking your Google session…</p>
      <p style="margin-top:16px"><button type="button" class="btn btn-primary" id="google-signin-btn">Sign in with Google</button></p>
    </div>
  </div>

  <div id="admin-shell" class="shell hidden">
    <aside class="side nav-side" id="side-nav"></aside>

    <main class="main">
      <div class="top">
        <div>
          <h1>Outreach stats</h1>
          <p class="sub">Pipeline snapshot for Track A / Track B</p>
        </div>
        <button type="button" class="btn" id="refresh-btn">Refresh</button>
      </div>

      <div class="kpis">
        <div class="kpi"><div class="lbl">Total contacts</div><div class="val" id="kpi-total">—</div></div>
        <div class="kpi"><div class="lbl">Emails sent today</div><div class="val" id="kpi-sent">—</div></div>
        <div class="kpi"><div class="lbl">Replies this week</div><div class="val" id="kpi-replies">—</div></div>
        <div class="kpi"><div class="lbl">Active in sequence</div><div class="val" id="kpi-active">—</div></div>
      </div>

      <div class="detail-grid">
        <div class="card">
          <h2>By status</h2>
          <div id="by-status"></div>
        </div>
        <div class="card">
          <h2>By track</h2>
          <div id="by-track"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence,
    } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
    const firebaseConfig = {
      apiKey: 'AIzaSyD9fHOILnFLauZqd-C2AZwm-vrkpQk-sV4',
      authDomain: 'powerhouse-tech-f6da1.firebaseapp.com',
      projectId: 'powerhouse-tech-f6da1',
      storageBucket: 'powerhouse-tech-f6da1.firebasestorage.app',
      messagingSenderId: '946732625664',
      appId: '1:946732625664:web:627677c716fcf7c16b0de5',
      measurementId: 'G-QRZLG84GYV',
    };
    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence).catch(() => {});
    window.phFirebaseAuth = {
      auth,
      googleProvider: new GoogleAuthProvider(),
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    };
    window.dispatchEvent(new CustomEvent('ph-firebase-ready'));
  </script>
  <script src="/outreach/app.js?v=5"></script>
  <script>
    (async function () {
      const ui = window.OutreachUI;
      const me = await ui.requireAdminShell();
      if (!me) return;
      await ui.renderIndustrySidebar('stats', me.email);

      async function load() {
        try {
          const data = await ui.api('/api/stats');
          document.getElementById('kpi-total').textContent = String(data.total);
          document.getElementById('kpi-sent').textContent = String(data.emailsSentToday.total);
          document.getElementById('kpi-replies').textContent = String(data.repliesThisWeek);
          const active = (data.byStatus || [])
            .filter((r) => ['Day1 Sent', 'Day4 Sent', 'Day9 Sent', 'Email Found'].includes(r.status))
            .reduce((n, r) => n + r.count, 0);
          document.getElementById('kpi-active').textContent = String(active);

          document.getElementById('by-status').innerHTML = (data.byStatus || [])
            .map(
              (r) =>
                `<div class="field"><div class="k">${ui.badge(r.status)}</div><div><strong>${r.count}</strong></div></div>`
            )
            .join('') || '<p class="muted">No data</p>';

          document.getElementById('by-track').innerHTML = (data.byTrack || [])
            .map(
              (r) =>
                `<div class="field"><div class="k">${ui.esc(r.track)}</div><div><strong>${r.count}</strong></div></div>`
            )
            .join('') || '<p class="muted">No data</p>';
        } catch (err) {
          document.getElementById('by-status').innerHTML =
            '<p class="muted">' + ui.esc(err.message) + '</p>';
        }
      }

      document.getElementById('refresh-btn').addEventListener('click', load);
      await load();
    })();
  </script>
</body>
</html>
