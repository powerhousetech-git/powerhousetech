<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Outreach Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="https://powerhousetech.in/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/outreach/styles.css">
</head>
<body>
  <div id="admin-gate" class="gate">
    <div class="gate-card">
      <h1>Admin access</h1>
      <p class="muted" id="gate-msg">Checking your Google session…</p>
      <p style="margin-top:16px"><button type="button" class="btn btn-primary" id="google-signin-btn">Sign in with Google</button></p>
    </div>
  </div>

  <div id="admin-shell" class="shell hidden">
    <aside class="side nav-side" id="side-nav"></aside>

    <main class="main">
      <div class="top">
        <div>
          <h1 id="title">Contact</h1>
          <p class="sub" id="subtitle">Loading…</p>
        </div>
        <a class="btn" href="/outreach/">← All contacts</a>
      </div>

      <div class="detail-grid" id="detail">
        <div class="card">
          <h2>Fields</h2>
          <div id="fields"></div>
          <div style="margin-top:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <label class="muted" for="status-select">Status</label>
            <select id="status-select"></select>
            <button type="button" class="btn btn-primary" id="save-status">Save status</button>
          </div>
          <p class="muted" id="save-msg" style="margin-top:10px"></p>
        </div>
        <div class="card">
          <h2>Sequence timeline</h2>
          <ul class="timeline" id="timeline"></ul>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence,
    } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
    const firebaseConfig = {
      apiKey: 'AIzaSyD9fHOILnFLauZqd-C2AZwm-vrkpQk-sV4',
      authDomain: 'powerhouse-tech-f6da1.firebaseapp.com',
      projectId: 'powerhouse-tech-f6da1',
      storageBucket: 'powerhouse-tech-f6da1.firebasestorage.app',
      messagingSenderId: '946732625664',
      appId: '1:946732625664:web:627677c716fcf7c16b0de5',
      measurementId: 'G-QRZLG84GYV',
    };
    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence).catch(() => {});
    window.phFirebaseAuth = {
      auth,
      googleProvider: new GoogleAuthProvider(),
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    };
    window.dispatchEvent(new CustomEvent('ph-firebase-ready'));
  </script>
  <script src="/outreach/app.js?v=5"></script>
  <script>
    (async function () {
      const ui = window.OutreachUI;
      const me = await ui.requireAdminShell();
      if (!me) return;
      await ui.renderIndustrySidebar('dashboard', me.email);

      const id = new URLSearchParams(location.search).get('id');
      if (!id) {
        document.getElementById('subtitle').textContent = 'Missing contact id';
        return;
      }
      const statusSel = document.getElementById('status-select');
      ui.STATUSES.forEach((s) => {
        const o = document.createElement('option');
        o.value = s;
        o.textContent = s;
        statusSel.appendChild(o);
      });

      function render(c) {
        document.getElementById('title').textContent = c.name;
        document.getElementById('subtitle').textContent =
          (c.company || c.domain) + ' · ' + (c.track || 'No track');
        statusSel.value = c.status;

        const rows = [
          ['Email', c.email || '—'],
          ['Title', c.title || '—'],
          ['Company', c.company || '—'],
          ['Domain', c.domain],
          ['Country', c.country || '—'],
          ['Track', c.track || '—'],
          ['Source', c.source || '—'],
          ['Permutations', c.allPermutations || '—'],
          ['Created', ui.fmt(c.createdAt)],
          ['Updated', ui.fmt(c.updatedAt)],
        ];
        document.getElementById('fields').innerHTML = rows
          .map(
            ([k, v]) =>
              `<div class="field"><div class="k">${ui.esc(k)}</div><div>${ui.esc(v)}</div></div>`
          )
          .join('');

        const steps = [
          { label: 'Queued / discovered', at: c.createdAt, always: true },
          { label: 'Email found', at: c.email ? c.updatedAt : null, done: !!c.email },
          { label: 'Day 1 sent', at: c.day1SentAt },
          { label: 'Day 4 sent', at: c.day4SentAt },
          { label: 'Day 9 sent', at: c.day9SentAt },
          { label: 'Replied', at: c.repliedAt },
        ];
        document.getElementById('timeline').innerHTML = steps
          .map((s) => {
            const done = s.always || s.done || !!s.at;
            return `<li class="${done ? '' : 'pending'}">
              <strong>${ui.esc(s.label)}</strong>
              <div class="when">${done && s.at ? ui.fmt(s.at) : done ? 'Yes' : 'Pending'}</div>
            </li>`;
          })
          .join('');
      }

      try {
        const { contact } = await ui.api('/api/contacts/' + encodeURIComponent(id));
        render(contact);
      } catch (err) {
        document.getElementById('subtitle').textContent = err.message;
      }

      document.getElementById('save-status').addEventListener('click', async () => {
        const msg = document.getElementById('save-msg');
        msg.textContent = 'Saving…';
        try {
          const { contact } = await ui.api('/api/contacts/' + encodeURIComponent(id), {
            method: 'PATCH',
            body: { status: statusSel.value },
          });
          render(contact);
          msg.textContent = 'Saved.';
        } catch (err) {
          msg.textContent = err.message;
        }
      });
    })();
  </script>
</body>
</html>
