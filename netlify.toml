# Static multi-page Powerhouse site + exported Med Spa dashboard
# Dashboard HTML/JS is committed under /dashboard and /_next (built via scripts/build-dashboard.sh).
[build]
  publish = "."
  command = ""

[dev]
  framework = "#static"
  publish = "."
  port = 8742

# Live Invoice Radar app (must stay above the /app → portal redirect)
[[redirects]]
  from = "/app/invoice-radar"
  to = "/app/invoice-radar.html"
  status = 200

# Public product demos (light static dashboards — no dark Next auth wall)
[[redirects]]
  from = "/demo/ai-sales-outreach"
  to = "/demos/ai-sales-outreach.html"
  status = 200

[[redirects]]
  from = "/demo/ai-sales-outreach/"
  to = "/demos/ai-sales-outreach.html"
  status = 200

[[redirects]]
  from = "/demo/card-capture"
  to = "/demos/card-capture.html"
  status = 200

[[redirects]]
  from = "/demo/card-capture/"
  to = "/demos/card-capture.html"
  status = 200

# Legacy Med Spa URL → AI Sales Outreach demo (force: static /dashboard/demo/ still exists)
[[redirects]]
  from = "/dashboard/demo"
  to = "/demo/ai-sales-outreach"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard/demo/"
  to = "/demo/ai-sales-outreach"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard/demo/*"
