# Static multi-page Powerhouse site + exported Med Spa dashboard
# Dashboard HTML/JS is committed under /dashboard and /_next (built via scripts/build-dashboard.sh).
[build]
  publish = "."
  command = ""

[dev]
  framework = "#static"
  publish = "."
  port = 8742

# Live Invoice Radar app (must stay above the /app → portal redirect)
[[redirects]]
  from = "/app/invoice-radar"
  to = "/app/invoice-radar.html"
  status = 200

# Old Overview workspace is retired as a landing — send people to the portal
[[redirects]]
  from = "/app"
  to = "/portal"
  status = 302

[[redirects]]
  from = "/app/"
  to = "/portal"
  status = 302

[[redirects]]
  from = "/workspace"
  to = "/portal"
  status = 302

[[redirects]]
  from = "/workspace/"
  to = "/portal"
  status = 302

# Opt-in legacy shell (credits / retired tools) — not a default landing
[[redirects]]
  from = "/app/workspace"
  to = "/index.html?workspace=1"
  status = 200

# Client portal — sign in → choose a service dashboard
[[redirects]]
  from = "/portal"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/client"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/portal.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200

# Invoice Radar sample dashboard (interactive demo data)
[[redirects]]
  from = "/invoice-dashboard"
  to = "/invoice-radar-portal.html"
  status = 200

[[redirects]]
  from = "/invoice-dashboard/"
  to = "/invoice-radar-portal.html"
  status = 200

# Med spa ROI dashboard (static export from medspa-dashboard/)
[[redirects]]
  from = "/dashboard"
  to = "/dashboard/demo/"
  status = 302

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard/demo/"
  status = 302

# Marketing subpages — clean URLs (match local `serve` behavior)
[[redirects]]
  from = "/solutions"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/invoice-radar"
  to = "/invoice-radar.html"
  status = 200

[[redirects]]
  from = "/ai-sales-outreach"
  to = "/ai-sales-outreach.html"
