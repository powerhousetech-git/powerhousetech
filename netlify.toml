# Static multi-page Powerhouse site + exported Med Spa dashboard
[build]
  publish = "."
  # Rebuild dashboard when possible; fall back to committed /dashboard + /_next
  command = "bash scripts/build-dashboard.sh || echo 'Using prebuilt dashboard assets'"

[dev]
  framework = "#static"
  publish = "."
  port = 8742

# Client workspace: optional clean URL
[[redirects]]
  from = "/workspace"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app/invoice-radar"
  to = "/app/invoice-radar.html"
  status = 200

# Med spa ROI dashboard (static export from medspa-dashboard/)
[[redirects]]
  from = "/dashboard"
  to = "/dashboard/demo/"
  status = 302

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard/demo/"
  status = 302

# Marketing subpages — clean URLs (match local `serve` behavior)
[[redirects]]
  from = "/solutions"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/invoice-radar"
  to = "/invoice-radar.html"
  status = 200

[[redirects]]
  from = "/ai-sales-outreach"
  to = "/ai-sales-outreach.html"
  status = 200

[[redirects]]
  from = "/exhibition-leads"
  to = "/exhibition-leads.html"
  status = 200

[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/how-we-work"
  to = "/#how-it-works"
  status = 301

[[redirects]]
  from = "/how-we-work.html"
  to = "/#how-it-works"
  status = 301

[[redirects]]
  from = "/sample-automations"
  to = "/sample-automations.html"
  status = 200

[[redirects]]
  from = "/industries"
  to = "/industries.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/contact"
