# Static multi-page Powerhouse site
[build]
  publish = "."
  command = ""

[dev]
  framework = "#static"
  publish = "."
  port = 8742

# Client workspace: optional clean URL
[[redirects]]
  from = "/workspace"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200

# Marketing subpages — clean URLs (match local `serve` behavior)
[[redirects]]
  from = "/solutions"
  to = "/services.html"
  status = 301

[[redirects]]
  from = "/invoice-radar"
  to = "/invoice-radar.html"
  status = 200

