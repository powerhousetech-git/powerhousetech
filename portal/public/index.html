<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outreach — PowerhouseTech Admin</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="admin-gate" class="gate">
    <div class="gate-card">
      <h1>Admin access</h1>
      <p class="muted" id="gate-msg">Checking your Google session…</p>
      <p style="margin-top:16px"><button type="button" class="btn btn-primary" id="google-signin-btn">Sign in with Google</button></p>
      <p class="muted" style="margin-top:12px;font-size:.8rem">Outreach portal is admin-only (same Google admins as /admin).</p>
    </div>
  </div>

  <div id="admin-shell" class="shell hidden">
    <aside class="side">
      <div class="brand">Outreach</div>
      <a class="active" data-nav="contacts" href="/">Contacts</a>
      <a data-nav="stats" href="/stats">Stats</a>
      <div style="margin-top:auto;padding:12px 10px;font-size:.78rem;color:#777">
        <div id="admin-email" class="muted"></div>
        <button type="button" id="admin-signout" style="margin-top:8px;width:100%">Sign out</button>
        <a class="btn" href="/admin" style="margin-top:8px;width:100%;justify-content:center">← Admin</a>
      </div>
    </aside>

    <main class="main">
      <div class="top">
        <div>
          <h1>Contacts</h1>
          <p class="sub">Queue → email found → Day 1 / 4 / 9 → replied</p>
        </div>
        <button type="button" class="btn" id="refresh-btn">Refresh</button>
      </div>

      <div class="filters">
        <select id="filter-status">
          <option value="">All statuses</option>
        </select>
        <select id="filter-track">
          <option value="">All tracks</option>
        </select>
        <input id="filter-domain" type="search" placeholder="Domain…" style="min-width:160px">
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Company</th>
              <th>Track</th>
              <th>Status</th>
              <th>Email</th>
              <th>Updated</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="6" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js';
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
      setPersistence, browserLocalPersistence,
    } from 'https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js';
    const firebaseConfig = {
      apiKey: 'AIzaSyD9fHOILnFLauZqd-C2AZwm-vrkpQk-sV4',
      authDomain: 'powerhouse-tech-f6da1.firebaseapp.com',
      projectId: 'powerhouse-tech-f6da1',
      storageBucket: 'powerhouse-tech-f6da1.firebasestorage.app',
      messagingSenderId: '946732625664',
      appId: '1:946732625664:web:627677c716fcf7c16b0de5',
      measurementId: 'G-QRZLG84GYV',
    };
    const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence).catch(() => {});
    window.phFirebaseAuth = {
      auth,
      googleProvider: new GoogleAuthProvider(),
      signInWithPopup,
      signOut,
      onAuthStateChanged,
    };
    window.dispatchEvent(new CustomEvent('ph-firebase-ready'));
  </script>
  <script src="/app.js"></script>
  <script>
    (async function () {
      const ui = window.OutreachUI;
      const me = await ui.requireAdminShell();
      if (!me) return;
      ui.navActive('contacts');

      const statusSel = document.getElementById('filter-status');
      const trackSel = document.getElementById('filter-track');
      ui.STATUSES.forEach((s) => {
        const o = document.createElement('option');
        o.value = s;
        o.textContent = s;
        statusSel.appendChild(o);
      });
      ui.TRACKS.forEach((t) => {
        const o = document.createElement('option');
        o.value = t;
        o.textContent = t;
        trackSel.appendChild(o);
      });

      async function load() {
        const params = new URLSearchParams();
        if (statusSel.value) params.set('status', statusSel.value);
        if (trackSel.value) params.set('track', trackSel.value);
        const domain = document.getElementById('filter-domain').value.trim();
        if (domain) params.set('domain', domain);
        params.set('limit', '200');
        params.set('sort', 'updatedAt:desc');
        const body = document.getElementById('rows');
        body.innerHTML = '<tr><td colspan="6" class="empty">Loading…</td></tr>';
        try {
          const data = await ui.api('/api/contacts?' + params.toString());
          if (!data.contacts.length) {
            body.innerHTML = '<tr><td colspan="6" class="empty">No contacts yet.</td></tr>';
            return;
          }
          body.innerHTML = data.contacts
            .map(
              (c) => `<tr class="clickable" data-id="${ui.esc(c.id)}">
              <td><strong>${ui.esc(c.name)}</strong><div class="muted">${ui.esc(c.title || '')}</div></td>
              <td>${ui.esc(c.company || '—')}<div class="muted">${ui.esc(c.domain)}</div></td>
              <td>${ui.esc(c.track || '—')}</td>
              <td>${ui.badge(c.status)}</td>
              <td>${ui.esc(c.email || '—')}</td>
              <td>${ui.fmt(c.updatedAt)}</td>
            </tr>`
            )
            .join('');
          body.querySelectorAll('tr.clickable').forEach((tr) => {
            tr.addEventListener('click', () => {
              location.href = '/contacts/' + tr.getAttribute('data-id');
            });
          });
        } catch (err) {
          body.innerHTML =
            '<tr><td colspan="6" class="empty">' + ui.esc(err.message) + '</td></tr>';
        }
      }

      statusSel.addEventListener('change', load);
      trackSel.addEventListener('change', load);
      document.getElementById('filter-domain').addEventListener('change', load);
      document.getElementById('refresh-btn').addEventListener('click', load);
      await load();
    })();
  </script>
</body>
</html>
